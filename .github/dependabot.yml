version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Novosibirsk
    open-pull-requests-limit: 5
    groups:
      androidx-and-compose:
        patterns:
          - "androidx.*"
      kotlin-and-android-build:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin.*"
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Novosibirsk
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
